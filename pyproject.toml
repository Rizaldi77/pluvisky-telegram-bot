[project]
name = "pluvisky"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nathaniela Aptanta Parama" },
    { name = "Rizaldi Aidinul Hakim" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "loguru==0.6.0",
    "lxml==6.1.3",
    "numpy==1.26.0",
    "pandas==2.1.1",
    "pendulum==3.3.0",
    "psycopg2-binary==2.9.10",
    "pydantic==1.10.4",
    "python-dateutil==3.0.0",
    "python-dotenv==0.21.1",
    "python-telegram-bot==22.8",
    "requests==2.32.3",
    "sqlalchemy==2.0.22",
]

[project.scripts]
pluvisky = "pluvisky.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
